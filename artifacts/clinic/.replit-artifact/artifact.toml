kind = "web"
previewPath = "/"
title = "SIA Clinic Management"
description = "SIA (سِيَا) is a full-featured clinic management system for Arabic-speaking clinics. It manages patients, appointments, doctor queues, prescriptions, pharmacy inventory, and analytics. Roles: Admin, Doctor, Receptionist, Patient."
version = "1.0.0"
id = "artifacts/clinic"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20964

[services.development]
run = "pnpm --filter @workspace/clinic run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clinic", "run", "build" ]
serve = "static"
publicDir = "artifacts/clinic/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20964"
BASE_PATH = "/"
