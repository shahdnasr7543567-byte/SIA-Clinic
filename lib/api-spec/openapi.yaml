openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SIA Clinic Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: patients
    description: Patient management
  - name: queue
    description: Queue management
  - name: prescriptions
    description: Prescription management
  - name: drugs
    description: Drug catalog
  - name: pharmacy
    description: Pharmacy operations
  - name: appointments
    description: Appointment / follow-up management
  - name: dashboard
    description: Dashboard summaries

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new patient account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user info
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ── Patients ────────────────────────────────────────────────────────────────
  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List all patients
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: number
        - name: offset
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Register a new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Created patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get a patient by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found
    patch:
      operationId: updatePatient
      tags: [patients]
      summary: Update patient info
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}/analytics:
    get:
      operationId: getPatientAnalytics
      tags: [patients]
      summary: Get analytics for a specific patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Patient analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientAnalytics"

  /patients/{id}/prescriptions:
    get:
      operationId: getPatientPrescriptions
      tags: [patients]
      summary: Get prescription history for a patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Prescription history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prescription"

  # ── Queue ───────────────────────────────────────────────────────────────────
  /queue:
    get:
      operationId: listQueue
      tags: [queue]
      summary: Get the current waiting queue
      parameters:
        - name: doctorId
          in: query
          schema:
            type: ["number", "null"]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Queue entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueEntry"
    post:
      operationId: addToQueue
      tags: [queue]
      summary: Add patient to waiting queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueInput"
      responses:
        "201":
          description: Queue entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueEntry"

  /queue/{id}:
    patch:
      operationId: updateQueueEntry
      tags: [queue]
      summary: Update queue entry status (done/cancelled)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueEntryUpdate"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueEntry"

  # ── Prescriptions ───────────────────────────────────────────────────────────
  /prescriptions:
    get:
      operationId: listPrescriptions
      tags: [prescriptions]
      summary: List prescriptions
      parameters:
        - name: patientId
          in: query
          schema:
            type: ["number", "null"]
        - name: doctorId
          in: query
          schema:
            type: ["number", "null"]
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prescription"
    post:
      operationId: createPrescription
      tags: [prescriptions]
      summary: Create a prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /prescriptions/{id}:
    get:
      operationId: getPrescription
      tags: [prescriptions]
      summary: Get a single prescription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"
    patch:
      operationId: updatePrescription
      tags: [prescriptions]
      summary: Update prescription status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  # ── Drugs ───────────────────────────────────────────────────────────────────
  /drugs:
    get:
      operationId: listDrugs
      tags: [drugs]
      summary: List all drugs in the catalog
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: form
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Drug list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Drug"
    post:
      operationId: createDrug
      tags: [drugs]
      summary: Add drug to catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drug"

  # ── Pharmacy ─────────────────────────────────────────────────────────────────
  /pharmacy/inventory:
    get:
      operationId: listInventory
      tags: [pharmacy]
      summary: List pharmacy drug inventory
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: lowStock
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [pharmacy]
      summary: Add item to inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /pharmacy/inventory/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [pharmacy]
      summary: Update inventory item quantity/details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /pharmacy/dispense:
    post:
      operationId: dispensePrescription
      tags: [pharmacy]
      summary: Dispense a prescription (fulfill it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispenseInput"
      responses:
        "200":
          description: Dispensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /pharmacy/dispensed:
    get:
      operationId: listDispensed
      tags: [pharmacy]
      summary: List dispensed prescriptions
      responses:
        "200":
          description: Dispensed list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prescription"

  # ── Appointments ─────────────────────────────────────────────────────────────
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List follow-up appointments
      parameters:
        - name: patientId
          in: query
          schema:
            type: ["number", "null"]
        - name: doctorId
          in: query
          schema:
            type: ["number", "null"]
        - name: upcoming
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create a follow-up appointment / reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update appointment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  # ── Dashboard ─────────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get summary statistics for the reception dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/peak-hours:
    get:
      operationId: getPeakHours
      tags: [dashboard]
      summary: Get peak hours data for chart
      responses:
        "200":
          description: Peak hours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PeakHourEntry"

  /dashboard/top-diagnoses:
    get:
      operationId: getTopDiagnoses
      tags: [dashboard]
      summary: Get top diagnoses for chart
      responses:
        "200":
          description: Top diagnoses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiagnosisEntry"

  /dashboard/recent-patients:
    get:
      operationId: getRecentPatients
      tags: [dashboard]
      summary: Get last 5 registered patients
      responses:
        "200":
          description: Recent patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"

  /dashboard/doctor-stats:
    get:
      operationId: getDoctorStats
      tags: [dashboard]
      summary: Stats for doctor view (patients, prescriptions, revenue)
      parameters:
        - name: doctorId
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Doctor stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorStats"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Auth ──────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [name, email, mobile, password]
      properties:
        name:
          type: string
        email:
          type: string
        mobile:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, doctor, receptionist, patient]
        mobile:
          type: ["string", "null"]
        specialty:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # ── Patients ──────────────────────────────────────────────────────────────
    Patient:
      type: object
      required: [id, name, mobile, age, priority, visitType, examType, bookingType, status, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        mobile:
          type: string
        age:
          type: number
        priority:
          type: string
          enum: [normal, urgent, critical]
        visitType:
          type: string
          enum: [new, followup]
        examType:
          type: string
          enum: [clinic, home, online]
        bookingType:
          type: string
          enum: [online, cash, instapay]
        status:
          type: string
          enum: [waiting, done, cancelled]
        notes:
          type: ["string", "null"]
        chronicDiseases:
          type: ["string", "null"]
        allergies:
          type: ["string", "null"]
        totalVisits:
          type: number
        firstVisit:
          type: ["string", "null"]
        lastVisit:
          type: ["string", "null"]
        topDiagnosis:
          type: ["string", "null"]
        userId:
          type: ["number", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    PatientInput:
      type: object
      required: [name, mobile, age, priority, visitType, examType, bookingType]
      properties:
        name:
          type: string
        mobile:
          type: string
        age:
          type: number
        priority:
          type: string
          enum: [normal, urgent, critical]
        visitType:
          type: string
          enum: [new, followup]
        examType:
          type: string
          enum: [clinic, home, online]
        bookingType:
          type: string
          enum: [online, cash, instapay]
        notes:
          type: string
        chronicDiseases:
          type: string
        allergies:
          type: string
        userId:
          type: number

    PatientUpdate:
      type: object
      properties:
        name:
          type: string
        mobile:
          type: string
        age:
          type: number
        priority:
          type: string
          enum: [normal, urgent, critical]
        visitType:
          type: string
          enum: [new, followup]
        examType:
          type: string
          enum: [clinic, home, online]
        bookingType:
          type: string
          enum: [online, cash, instapay]
        notes:
          type: string
        chronicDiseases:
          type: string
        allergies:
          type: string
        status:
          type: string
          enum: [waiting, done, cancelled]

    PatientAnalytics:
      type: object
      required: [totalVisits, monthlyVisits, diagnosisDistribution]
      properties:
        totalVisits:
          type: number
        firstVisit:
          type: ["string", "null"]
        lastVisit:
          type: ["string", "null"]
        topDiagnosis:
          type: ["string", "null"]
        monthlyVisits:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyVisit"
        diagnosisDistribution:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosisEntry"

    MonthlyVisit:
      type: object
      required: [month, count]
      properties:
        month:
          type: string
        count:
          type: number

    # ── Queue ─────────────────────────────────────────────────────────────────
    QueueEntry:
      type: object
      required: [id, patientId, status, priority, addedAt]
      properties:
        id:
          type: number
        patientId:
          type: number
        patient:
          $ref: "#/components/schemas/Patient"
        doctorId:
          type: ["number", "null"]
        status:
          type: string
          enum: [waiting, called, done, cancelled]
        priority:
          type: string
          enum: [normal, urgent, critical]
        notes:
          type: ["string", "null"]
        addedAt:
          type: string
        completedAt:
          type: ["string", "null"]

    QueueInput:
      type: object
      required: [patientId, priority]
      properties:
        patientId:
          type: number
        doctorId:
          type: number
        priority:
          type: string
          enum: [normal, urgent, critical]
        notes:
          type: string

    QueueEntryUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [waiting, called, done, cancelled]

    # ── Prescriptions ─────────────────────────────────────────────────────────
    Prescription:
      type: object
      required: [id, patientId, doctorId, diagnosis, drugs, status, createdAt]
      properties:
        id:
          type: number
        patientId:
          type: number
        patient:
          $ref: "#/components/schemas/Patient"
        doctorId:
          type: number
        doctor:
          $ref: "#/components/schemas/User"
        diagnosis:
          type: string
        drugs:
          type: array
          items:
            $ref: "#/components/schemas/PrescriptionDrug"
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, dispensed, cancelled]
        prescriptionCode:
          type: ["string", "null"]
        createdAt:
          type: string

    PrescriptionDrug:
      type: object
      required: [drugId, drugName, form, dosage, duration, unit]
      properties:
        drugId:
          type: number
        drugName:
          type: string
        form:
          type: string
        dosage:
          type: string
        duration:
          type: string
        unit:
          type: string

    PrescriptionInput:
      type: object
      required: [patientId, doctorId, diagnosis, drugs]
      properties:
        patientId:
          type: number
        doctorId:
          type: number
        diagnosis:
          type: string
        drugs:
          type: array
          items:
            $ref: "#/components/schemas/PrescriptionDrug"
        notes:
          type: string

    PrescriptionUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [active, dispensed, cancelled]
        notes:
          type: string

    # ── Drugs ─────────────────────────────────────────────────────────────────
    Drug:
      type: object
      required: [id, name, form, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        genericName:
          type: ["string", "null"]
        form:
          type: string
          enum: [tablet, syrup, ointment, injection, spray, capsule, drops, other]
        interactions:
          type: ["string", "null"]
        contraindications:
          type: ["string", "null"]
        createdAt:
          type: string

    DrugInput:
      type: object
      required: [name, form]
      properties:
        name:
          type: string
        genericName:
          type: string
        form:
          type: string
          enum: [tablet, syrup, ointment, injection, spray, capsule, drops, other]
        interactions:
          type: string
        contraindications:
          type: string

    # ── Pharmacy ──────────────────────────────────────────────────────────────
    InventoryItem:
      type: object
      required: [id, drugId, drugName, quantity, unit, price, createdAt]
      properties:
        id:
          type: number
        drugId:
          type: number
        drugName:
          type: string
        quantity:
          type: number
        unit:
          type: string
        price:
          type: number
        minimumStock:
          type: number
        expiryDate:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    InventoryItemInput:
      type: object
      required: [drugId, drugName, quantity, unit, price]
      properties:
        drugId:
          type: number
        drugName:
          type: string
        quantity:
          type: number
        unit:
          type: string
        price:
          type: number
        minimumStock:
          type: number
        expiryDate:
          type: string

    InventoryItemUpdate:
      type: object
      properties:
        quantity:
          type: number
        price:
          type: number
        minimumStock:
          type: number
        expiryDate:
          type: string

    DispenseInput:
      type: object
      required: [prescriptionId]
      properties:
        prescriptionId:
          type: number

    # ── Appointments ──────────────────────────────────────────────────────────
    Appointment:
      type: object
      required: [id, patientId, scheduledDate, status, createdAt]
      properties:
        id:
          type: number
        patientId:
          type: number
        patient:
          $ref: "#/components/schemas/Patient"
        doctorId:
          type: ["number", "null"]
        scheduledDate:
          type: string
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
        reminderType:
          type: string
          enum: [tomorrow, week, month, custom]
        createdAt:
          type: string

    AppointmentInput:
      type: object
      required: [patientId, scheduledDate, reminderType]
      properties:
        patientId:
          type: number
        doctorId:
          type: number
        scheduledDate:
          type: string
        notes:
          type: string
        reminderType:
          type: string
          enum: [tomorrow, week, month, custom]

    AppointmentUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
        scheduledDate:
          type: string
        notes:
          type: string

    # ── Dashboard ─────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalPatients, waiting, done, revenue]
      properties:
        totalPatients:
          type: number
        waiting:
          type: number
        done:
          type: number
        revenue:
          type: number

    PeakHourEntry:
      type: object
      required: [hour, count]
      properties:
        hour:
          type: string
        count:
          type: number

    DiagnosisEntry:
      type: object
      required: [diagnosis, count]
      properties:
        diagnosis:
          type: string
        count:
          type: number

    DoctorStats:
      type: object
      required: [patientsToday, totalPrescriptions, revenue]
      properties:
        patientsToday:
          type: number
        totalPrescriptions:
          type: number
        revenue:
          type: number
